name: Build Minimal FFmpeg (All Platforms)

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: n6.1

jobs:

  ############################################
  # Linux + Windows (cross compile)
  ############################################
  build-linux-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            nasm \
            yasm \
            mingw-w64 \
            pkg-config

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout $FFMPEG_VERSION

      ########################################
      # Build Linux x86_64
      ########################################
      - name: Build Linux x86_64
        run: |
          cd FFmpeg
          make distclean || true

          ./configure \
            --arch=x86_64 \
            --target-os=linux \
            --disable-everything \
            --enable-ffmpeg \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
            --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
            --enable-parser=h264,hevc,mpeg4video,av1 \
            --enable-encoder=mjpeg,png \
            --enable-muxer=image2 \
            --enable-filter=scale \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-ffplay \
            --disable-ffprobe

          make -j$(nproc)
          cp ffmpeg ../ffmpeg-linux-x86_64

      ########################################
      # Build Windows x86_64
      ########################################
      - name: Build Windows x86_64
        run: |
          cd FFmpeg
          make distclean

          ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --disable-everything \
            --enable-ffmpeg \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
            --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
            --enable-parser=h264,hevc,mpeg4video,av1 \
            --enable-encoder=mjpeg,png \
            --enable-muxer=image2 \
            --enable-filter=scale \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-ffplay \
            --disable-ffprobe

          make -j$(nproc)
          cp ffmpeg.exe ../ffmpeg-windows-x86_64.exe

      - name: Upload Linux/Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-windows
          path: |
            ffmpeg-linux-x86_64
            ffmpeg-windows-x86_64.exe


  ############################################
  # macOS (Intel + Apple Silicon)
  ############################################
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install nasm pkg-config

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout $FFMPEG_VERSION

      ########################################
      # macOS x86_64
      ########################################
      - name: Build macOS x86_64
        run: |
          cd FFmpeg
          make distclean || true

          ./configure \
            --arch=x86_64 \
            --target-os=darwin \
            --disable-everything \
            --enable-ffmpeg \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
            --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
            --enable-parser=h264,hevc,mpeg4video,av1 \
            --enable-encoder=mjpeg,png \
            --enable-muxer=image2 \
            --enable-filter=scale \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-ffplay \
            --disable-ffprobe

          make -j$(sysctl -n hw.ncpu)
          cp ffmpeg ../ffmpeg-macos-x86_64

      ########################################
      # macOS arm64
      ########################################
      - name: Build macOS arm64
        run: |
          cd FFmpeg
          make distclean

          ./configure \
            --arch=arm64 \
            --target-os=darwin \
            --disable-everything \
            --enable-ffmpeg \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
            --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
            --enable-parser=h264,hevc,mpeg4video,av1 \
            --enable-encoder=mjpeg,png \
            --enable-muxer=image2 \
            --enable-filter=scale \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-ffplay \
            --disable-ffprobe

          make -j$(sysctl -n hw.ncpu)
          cp ffmpeg ../ffmpeg-macos-arm64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: |
            ffmpeg-macos-x86_64
            ffmpeg-macos-arm64
