name: Build Minimal FFmpeg (All Platforms)

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: n6.1

jobs:

############################################################
# Linux + Windows (x86_64 + arm64)
############################################################

  build-linux-windows:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - linux-x86_64
          - linux-arm64
          - windows-x86_64
          - windows-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            nasm \
            yasm \
            pkg-config \
            mingw-w64 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout $FFMPEG_VERSION

      - name: Configure & Build
        run: |
          cd FFmpeg
          make distclean || true

          case "${{ matrix.target }}" in

          linux-x86_64)
            ./configure \
              --arch=x86_64 \
              --cpu=generic \
              --target-os=linux \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
              --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
              --enable-parser=h264,hevc,mpeg4video,av1 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --disable-network \
              --disable-ffplay \
              --disable-ffprobe
            make -j$(nproc)
            cp ffmpeg ../ffmpeg-linux-x86_64
            ;;

          linux-arm64)
            ./configure \
              --arch=arm64 \
              --cpu=generic \
              --target-os=linux \
              --cross-prefix=aarch64-linux-gnu- \
              --disable-x86asm \
              --disable-inline-asm \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
              --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
              --enable-parser=h264,hevc,mpeg4video,av1 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --disable-network \
              --disable-ffplay \
              --disable-ffprobe
            make -j$(nproc)
            cp ffmpeg ../ffmpeg-linux-arm64
            ;;

          windows-x86_64)
            ./configure \
              --arch=x86_64 \
              --cpu=generic \
              --target-os=mingw32 \
              --cross-prefix=x86_64-w64-mingw32- \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
              --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
              --enable-parser=h264,hevc,mpeg4video,av1 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --disable-network \
              --disable-ffplay \
              --disable-ffprobe
            make -j$(nproc)
            cp ffmpeg.exe ../ffmpeg-windows-x86_64.exe
            ;;

          windows-arm64)
            ./configure \
              --arch=arm64 \
              --cpu=generic \
              --target-os=mingw32 \
              --cross-prefix=aarch64-w64-mingw32- \
              --disable-x86asm \
              --disable-inline-asm \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
              --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
              --enable-parser=h264,hevc,mpeg4video,av1 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --disable-network \
              --disable-ffplay \
              --disable-ffprobe
            make -j$(nproc)
            cp ffmpeg.exe ../ffmpeg-windows-arm64.exe
            ;;

          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-*
          
############################################################
# macOS (x86_64 + arm64)
############################################################

  build-macos:
    runs-on: macos-latest

    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install nasm pkg-config

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout $FFMPEG_VERSION

      - name: Configure & Build
        run: |
          cd FFmpeg
          make distclean || true

          if [ "${{ matrix.arch }}" = "x86_64" ]; then

            ./configure \
              --arch=x86_64 \
              --cpu=generic \
              --target-os=darwin \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
              --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
              --enable-parser=h264,hevc,mpeg4video,av1 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --disable-network \
              --disable-ffplay \
              --disable-ffprobe

            make -j$(sysctl -n hw.ncpu)
            cp ffmpeg ../ffmpeg-macos-x86_64

          else

            ./configure \
              --arch=arm64 \
              --cpu=generic \
              --target-os=darwin \
              --disable-x86asm \
              --disable-inline-asm \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
              --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
              --enable-parser=h264,hevc,mpeg4video,av1 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --disable-network \
              --disable-ffplay \
              --disable-ffprobe

            make -j$(sysctl -n hw.ncpu)
            cp ffmpeg ../ffmpeg-macos-arm64

          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-${{ matrix.arch }}
          path: ffmpeg-macos-*
