name: Build Minimal FFmpeg (All OS + All Arch)

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: n6.1

jobs:

  ########################################################
  # Linux + Windows (x86_64 + arm64)
  ########################################################
  build-linux-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            nasm \
            yasm \
            pkg-config \
            mingw-w64 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout $FFMPEG_VERSION

      ####################################################
      # Linux x86_64
      ####################################################
      - name: Build Linux x86_64
        run: |
          cd FFmpeg
          make distclean || true

          ./configure \
            --arch=x86_64 \
            --target-os=linux \
            --disable-everything \
            --enable-ffmpeg \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
            --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
            --enable-parser=h264,hevc,mpeg4video,av1 \
            --enable-encoder=mjpeg,png \
            --enable-muxer=image2 \
            --enable-filter=scale \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-ffplay \
            --disable-ffprobe

          make -j$(nproc)
          cp ffmpeg ../ffmpeg-linux-x86_64

      ####################################################
      # Linux arm64 (cross compile)
      ####################################################
      - name: Build Linux arm64
        run: |
          cd FFmpeg
          make distclean

          ./configure \
            --arch=aarch64 \
            --target-os=linux \
            --cross-prefix=aarch64-linux-gnu- \
            --enable-cross-compile \
            --disable-everything \
            --enable-ffmpeg \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
            --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
            --enable-parser=h264,hevc,mpeg4video,av1 \
            --enable-encoder=mjpeg,png \
            --enable-muxer=image2 \
            --enable-filter=scale \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-ffplay \
            --disable-ffprobe

          make -j$(nproc)
          cp ffmpeg ../ffmpeg-linux-arm64

      ####################################################
      # Windows x86_64
      ####################################################
      - name: Build Windows x86_64
        run: |
          cd FFmpeg
          make distclean

          ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --enable-cross-compile \
            --disable-everything \
            --enable-ffmpeg \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
            --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
            --enable-parser=h264,hevc,mpeg4video,av1 \
            --enable-encoder=mjpeg,png \
            --enable-muxer=image2 \
            --enable-filter=scale \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-ffplay \
            --disable-ffprobe

          make -j$(nproc)
          cp ffmpeg.exe ../ffmpeg-windows-x86_64.exe

      ####################################################
      # Windows arm64 (cross compile)
      ####################################################
      - name: Build Windows arm64
        run: |
          cd FFmpeg
          make distclean

          ./configure \
            --arch=aarch64 \
            --target-os=mingw32 \
            --cross-prefix=aarch64-w64-mingw32- \
            --enable-cross-compile \
            --disable-everything \
            --enable-ffmpeg \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
            --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
            --enable-parser=h264,hevc,mpeg4video,av1 \
            --enable-encoder=mjpeg,png \
            --enable-muxer=image2 \
            --enable-filter=scale \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-ffplay \
            --disable-ffprobe

          make -j$(nproc)
          cp ffmpeg.exe ../ffmpeg-windows-arm64.exe

      - name: Upload Linux + Windows
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-windows
          path: |
            ffmpeg-linux-x86_64
            ffmpeg-linux-arm64
            ffmpeg-windows-x86_64.exe
            ffmpeg-windows-arm64.exe


  ########################################################
  # macOS (Intel + Apple Silicon)
  ########################################################
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install nasm pkg-config

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout $FFMPEG_VERSION

      - name: Build macOS x86_64
        run: |
          cd FFmpeg
          make distclean || true
          ./configure --arch=x86_64 --target-os=darwin \
            --disable-everything \
            --enable-ffmpeg \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
            --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
            --enable-parser=h264,hevc,mpeg4video,av1 \
            --enable-encoder=mjpeg,png \
            --enable-muxer=image2 \
            --enable-filter=scale \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --disable-doc --disable-debug --disable-network \
            --disable-ffplay --disable-ffprobe
          make -j$(sysctl -n hw.ncpu)
          cp ffmpeg ../ffmpeg-macos-x86_64

      - name: Build macOS arm64
        run: |
          cd FFmpeg
          make distclean
          ./configure --arch=arm64 --target-os=darwin \
            --disable-everything \
            --enable-ffmpeg \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,asf,ogg,rm \
            --enable-decoder=h264,hevc,vp9,av1,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv40 \
            --enable-parser=h264,hevc,mpeg4video,av1 \
            --enable-encoder=mjpeg,png \
            --enable-muxer=image2 \
            --enable-filter=scale \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --disable-doc --disable-debug --disable-network \
            --disable-ffplay --disable-ffprobe
          make -j$(sysctl -n hw.ncpu)
          cp ffmpeg ../ffmpeg-macos-arm64

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: |
            ffmpeg-macos-x86_64
            ffmpeg-macos-arm64
