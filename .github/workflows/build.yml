name: Build Minimal FFmpeg

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: n6.1

############################################################
# Linux + Windows
############################################################

jobs:

  build-linux-windows:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - linux-x86_64
          - linux-arm64
          - windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            nasm \
            yasm \
            pkg-config \
            mingw-w64 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout $FFMPEG_VERSION

      - name: Configure & Build
        run: |
          cd FFmpeg
          make distclean || true

          case "${{ matrix.target }}" in

          ################################################
          # Linux x86_64
          ################################################
          linux-x86_64)

            ./configure \
              --arch=x86_64 \
              --cpu=generic \
              --target-os=linux \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file,http,https,tcp,tls \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo \
              --enable-decoder=h264,hevc,vp9,av1,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores \
              --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale,format \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --enable-network \
              --disable-ffplay \
              --disable-ffprobe

            make -j$(nproc)
            cp ffmpeg ../ffmpeg-linux-x86_64
            ;;

          ################################################
          # Linux arm64
          ################################################
          linux-arm64)

            ./configure \
              --arch=arm64 \
              --cpu=generic \
              --target-os=linux \
              --cross-prefix=aarch64-linux-gnu- \
              --disable-x86asm \
              --disable-inline-asm \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file,http,https,tcp,tls \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo \
              --enable-decoder=h264,hevc,vp9,av1,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores \
              --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale,format \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --enable-network \
              --disable-ffplay \
              --disable-ffprobe

            make -j$(nproc)
            cp ffmpeg ../ffmpeg-linux-arm64
            ;;

          ################################################
          # Windows x86_64
          ################################################
          windows-x86_64)

            ./configure \
              --arch=x86_64 \
              --cpu=generic \
              --target-os=mingw32 \
              --cross-prefix=x86_64-w64-mingw32- \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file,http,https,tcp,tls \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo \
              --enable-decoder=h264,hevc,vp9,av1,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv1,flv,vp6,vp6f,vp6a,theora,dnxhd,prores \
              --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale,format \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --enable-network \
              --disable-ffplay \
              --disable-ffprobe

            make -j$(nproc)
            cp ffmpeg.exe ../ffmpeg-windows-x86_64.exe
            ;;

          esac

      - name: Compress binaries
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            zip ffmpeg-${{ matrix.target }}.zip ffmpeg-*.exe
          else
            tar czf ffmpeg-${{ matrix.target }}.tar.gz ffmpeg-*
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz


############################################################
# macOS (x86_64 + arm64)
############################################################

  build-macos:
    runs-on: macos-latest

    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install nasm pkg-config

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout $FFMPEG_VERSION

      - name: Configure & Build
        run: |
          cd FFmpeg
          make distclean || true

          if [ "${{ matrix.arch }}" = "x86_64" ]; then

            ./configure \
              --arch=x86_64 \
              --cpu=generic \
              --cc="clang -arch x86_64" \
              --cxx="clang++ -arch x86_64" \
              --target-os=darwin \
              --disable-inline-asm \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file,http,https,tcp,tls \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo \
              --enable-decoder=h264,hevc,vp9,av1,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores \
              --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale,format \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --enable-network \
              --disable-ffplay \
              --disable-ffprobe

            make -j$(sysctl -n hw.ncpu)
            cp ffmpeg ../ffmpeg-macos-x86_64

          else

            ./configure \
              --arch=arm64 \
              --cpu=generic \
              --cc="clang -arch arm64" \
              --cxx="clang++ -arch arm64" \
              --target-os=darwin \
              --disable-x86asm \
              --disable-inline-asm \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file,http,https,tcp,tls \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo \
              --enable-decoder=h264,hevc,vp9,av1,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores \
              --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3 \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-filter=scale,format \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --enable-network \
              --disable-ffplay \
              --disable-ffprobe

            make -j$(sysctl -n hw.ncpu)
            cp ffmpeg ../ffmpeg-macos-arm64

          fi

      - name: Compress binaries
        run: |
          tar czf ffmpeg-macos-${{ matrix.arch }}.tar.gz ffmpeg-macos-*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-${{ matrix.arch }}
          path: |
            *.tar.gz
