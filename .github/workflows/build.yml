name: Build Minimal FFmpeg

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: n6.1
  ZIMG_VERSION: release-3.0.5
  DAV1D_VERSION: 1.4.1

############################################################
# Linux + Windows
############################################################

jobs:

  build-linux-windows:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - linux-x86_64
          - linux-arm64
          - windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            nasm \
            yasm \
            pkg-config \
            mingw-w64 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            autoconf \
            automake \
            libtool \
            ninja-build \
            meson

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout $FFMPEG_VERSION

      - name: Configure & Build
        run: |
          case "${{ matrix.target }}" in

          ################################################
          # Linux x86_64
          ################################################
          linux-x86_64)

            # Build zimg
            git clone -b $ZIMG_VERSION https://github.com/sekrit-twc/zimg.git zimg-src
            cd zimg-src
            sed -i 's/.*include.*tests\/Makefile.*/# &/' Makefile.am
            sed -i 's/.*include.*doc\/example\/Makefile.*/# &/' Makefile.am
            ./autogen.sh
            ./configure --prefix=$GITHUB_WORKSPACE/zimg-install --host=x86_64-linux-gnu --disable-shared --enable-static --with-pic --disable-unit-test
            make -j$(nproc) install
            cd ..

            # Build dav1d
            git clone -b $DAV1D_VERSION https://code.videolan.org/videolan/dav1d.git dav1d-src
            cd dav1d-src
            meson setup build --prefix=$GITHUB_WORKSPACE/dav1d-install --libdir=lib --default-library=static --buildtype=release
            ninja -C build install
            cd ..

            # Build mbedtls
            git clone --recursive -b v3.6.0 https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
            cd mbedtls-src
            CFLAGS="-fPIC" make -j$(nproc) lib
            # Manually "install" headers and libs to avoid submodule issues in the full 'install' target
            mkdir -p $GITHUB_WORKSPACE/mbedtls-install/usr/local/include
            mkdir -p $GITHUB_WORKSPACE/mbedtls-install/usr/local/lib
            cp -r include/mbedtls include/psa $GITHUB_WORKSPACE/mbedtls-install/usr/local/include/
            cp library/*.a $GITHUB_WORKSPACE/mbedtls-install/usr/local/lib/
            # Generate a minimal pkg-config for FFmpeg (optional but safer)
            cd ..

            # Setup PKG_CONFIG
            export PKG_CONFIG_PATH=$GITHUB_WORKSPACE/zimg-install/lib/pkgconfig:$GITHUB_WORKSPACE/dav1d-install/lib/pkgconfig:$GITHUB_WORKSPACE/mbedtls-install/usr/local/lib/pkgconfig
            export PKG_CONFIG_LIBDIR=$PKG_CONFIG_PATH
            export PKG_CONFIG_ALLOW_CROSS=1
            export ZIMG_INSTALL=$GITHUB_WORKSPACE/zimg-install
            export DAV1D_INSTALL=$GITHUB_WORKSPACE/dav1d-install
            export MBEDTLS_INSTALL=$GITHUB_WORKSPACE/mbedtls-install/usr/local
            
            pkg-config --modversion zimg || echo "zimg not found"
            pkg-config --modversion zimg || echo "zimg not found"
            pkg-config --modversion dav1d || echo "dav1d not found"

            cd FFmpeg
            ./configure \
              --arch=x86_64 \
              --cpu=generic \
              --target-os=linux \
              --disable-everything \
              --enable-ffmpeg \
              --enable-version3 \
              --enable-mbedtls \
              --enable-protocol=file,http,https,tcp,tls \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo \
              --enable-decoder=h264,hevc,vp9,libdav1d,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores \
              --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3 \
              --enable-bsf=hevc_metadata,av1_metadata,vp9_metadata \
              --enable-libzimg \
              --enable-libdav1d \
              --enable-filter=scale,format,zscale,tonemap \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --enable-network \
              --disable-ffplay \
              --disable-ffprobe \
              --pkg-config=pkg-config \
              --pkg-config-flags="--static" \
              --extra-cflags="-I$ZIMG_INSTALL/include -I$DAV1D_INSTALL/include -I$MBEDTLS_INSTALL/include" \
              --extra-ldflags="-L$ZIMG_INSTALL/lib -L$DAV1D_INSTALL/lib -L$MBEDTLS_INSTALL/lib -static" \
              --extra-ldexeflags="-static" \
              --extra-libs="-lmbedtls -lmbedx509 -lmbedcrypto -lpthread -lm -lstdc++"

            make -j$(nproc)
            cp ffmpeg ../ffmpeg-linux-x86_64
            ;;

          ################################################
          # Linux arm64
          ################################################
          linux-arm64)

            # Build zimg
            git clone -b $ZIMG_VERSION https://github.com/sekrit-twc/zimg.git zimg-src
            cd zimg-src
            sed -i 's/.*include.*tests\/Makefile.*/# &/' Makefile.am
            sed -i 's/.*include.*doc\/example\/Makefile.*/# &/' Makefile.am
            ./autogen.sh
            ./configure --prefix=$GITHUB_WORKSPACE/zimg-install --host=aarch64-linux-gnu --disable-shared --enable-static --with-pic --disable-unit-test
            make -j$(nproc) install
            cd ..

            # Build dav1d (Cross-compile)
            echo "[binaries]" > cross_linux_arm64.txt
            echo "c = 'aarch64-linux-gnu-gcc'" >> cross_linux_arm64.txt
            echo "cpp = 'aarch64-linux-gnu-g++'" >> cross_linux_arm64.txt
            echo "ar = 'aarch64-linux-gnu-ar'" >> cross_linux_arm64.txt
            echo "strip = 'aarch64-linux-gnu-strip'" >> cross_linux_arm64.txt
            echo "pkgconfig = 'pkg-config'" >> cross_linux_arm64.txt
            echo "[host_machine]" >> cross_linux_arm64.txt
            echo "system = 'linux'" >> cross_linux_arm64.txt
            echo "cpu_family = 'aarch64'" >> cross_linux_arm64.txt
            echo "cpu = 'aarch64'" >> cross_linux_arm64.txt
            echo "endian = 'little'" >> cross_linux_arm64.txt

            git clone -b $DAV1D_VERSION https://code.videolan.org/videolan/dav1d.git dav1d-src
            cd dav1d-src
            meson setup build --prefix=$GITHUB_WORKSPACE/dav1d-install --libdir=lib --cross-file ../cross_linux_arm64.txt --default-library=static --buildtype=release
            ninja -C build install
            cd ..

            # Build mbedtls (Cross-compile)
            git clone --recursive -b v3.6.0 https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
            cd mbedtls-src
            CC=aarch64-linux-gnu-gcc CFLAGS="-fPIC" make -j$(nproc) lib
            # Manually "install" headers and libs
            mkdir -p $GITHUB_WORKSPACE/mbedtls-install/usr/local/include
            mkdir -p $GITHUB_WORKSPACE/mbedtls-install/usr/local/lib
            cp -r include/mbedtls include/psa $GITHUB_WORKSPACE/mbedtls-install/usr/local/include/
            cp library/*.a $GITHUB_WORKSPACE/mbedtls-install/usr/local/lib/
            cd ..

            # Setup PKG_CONFIG
            export PKG_CONFIG_PATH=$GITHUB_WORKSPACE/zimg-install/lib/pkgconfig:$GITHUB_WORKSPACE/dav1d-install/lib/pkgconfig:$GITHUB_WORKSPACE/mbedtls-install/usr/local/lib/pkgconfig
            export PKG_CONFIG_LIBDIR=$PKG_CONFIG_PATH
            export PKG_CONFIG_ALLOW_CROSS=1
            export ZIMG_INSTALL=$GITHUB_WORKSPACE/zimg-install
            export DAV1D_INSTALL=$GITHUB_WORKSPACE/dav1d-install
            export MBEDTLS_INSTALL=$GITHUB_WORKSPACE/mbedtls-install/usr/local

            pkg-config --modversion zimg || echo "zimg not found"
            pkg-config --modversion dav1d || echo "dav1d not found"

            cd FFmpeg
            ./configure \
              --arch=arm64 \
              --cpu=generic \
              --target-os=linux \
              --cross-prefix=aarch64-linux-gnu- \
              --disable-x86asm \
              --disable-inline-asm \
              --disable-everything \
              --enable-ffmpeg \
              --enable-version3 \
              --enable-mbedtls \
              --enable-protocol=file,http,https,tcp,tls \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo \
              --enable-decoder=h264,hevc,vp9,libdav1d,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores \
              --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3 \
              --enable-bsf=hevc_metadata,av1_metadata,vp9_metadata \
              --enable-libzimg \
              --enable-libdav1d \
              --enable-filter=scale,format,zscale,tonemap \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --enable-network \
              --disable-ffplay \
              --disable-ffprobe \
              --pkg-config=pkg-config \
              --pkg-config-flags="--static" \
              --extra-cflags="-I$ZIMG_INSTALL/include -I$DAV1D_INSTALL/include -I$MBEDTLS_INSTALL/include" \
              --extra-ldflags="-L$ZIMG_INSTALL/lib -L$DAV1D_INSTALL/lib -L$MBEDTLS_INSTALL/lib -static" \
              --extra-ldexeflags="-static" \
              --extra-libs="-lmbedtls -lmbedx509 -lmbedcrypto -lpthread -lm -lstdc++"

            make -j$(nproc)
            cp ffmpeg ../ffmpeg-linux-arm64
            ;;

          ################################################
          # Windows x86_64
          ################################################
          windows-x86_64)

            # Build zimg
            git clone -b $ZIMG_VERSION https://github.com/sekrit-twc/zimg.git zimg-src
            cd zimg-src
            sed -i 's/.*include.*tests\/Makefile.*/# &/' Makefile.am
            sed -i 's/.*include.*doc\/example\/Makefile.*/# &/' Makefile.am
            ./autogen.sh
            ./configure --prefix=$GITHUB_WORKSPACE/zimg-install --host=x86_64-w64-mingw32 --disable-shared --enable-static --with-pic --disable-unit-test
            make -j$(nproc) install
            cd ..

            # Build dav1d (Cross-compile)
            echo "[binaries]" > cross_win_x64.txt
            echo "c = 'x86_64-w64-mingw32-gcc'" >> cross_win_x64.txt
            echo "cpp = 'x86_64-w64-mingw32-g++'" >> cross_win_x64.txt
            echo "ar = 'x86_64-w64-mingw32-ar'" >> cross_win_x64.txt
            echo "strip = 'x86_64-w64-mingw32-strip'" >> cross_win_x64.txt
            echo "windres = 'x86_64-w64-mingw32-windres'" >> cross_win_x64.txt
            echo "pkgconfig = 'pkg-config'" >> cross_win_x64.txt
            echo "[host_machine]" >> cross_win_x64.txt
            echo "system = 'windows'" >> cross_win_x64.txt
            echo "cpu_family = 'x86_64'" >> cross_win_x64.txt
            echo "cpu = 'x86_64'" >> cross_win_x64.txt
            echo "endian = 'little'" >> cross_win_x64.txt

            git clone -b $DAV1D_VERSION https://code.videolan.org/videolan/dav1d.git dav1d-src
            cd dav1d-src
            meson setup build --prefix=$GITHUB_WORKSPACE/dav1d-install --libdir=lib --cross-file ../cross_win_x64.txt --default-library=static --buildtype=release
            ninja -C build install
            cd ..

            # Setup PKG_CONFIG
            export PKG_CONFIG_PATH=$GITHUB_WORKSPACE/zimg-install/lib/pkgconfig:$GITHUB_WORKSPACE/dav1d-install/lib/pkgconfig
            export PKG_CONFIG_LIBDIR=$PKG_CONFIG_PATH
            export PKG_CONFIG_ALLOW_CROSS=1
            export ZIMG_INSTALL=$GITHUB_WORKSPACE/zimg-install
            export DAV1D_INSTALL=$GITHUB_WORKSPACE/dav1d-install

            pkg-config --modversion zimg || echo "zimg not found"
            pkg-config --modversion dav1d || echo "dav1d not found"

            cd FFmpeg
            ./configure \
              --arch=x86_64 \
              --cpu=generic \
              --target-os=mingw32 \
              --cross-prefix=x86_64-w64-mingw32- \
              --disable-everything \
              --enable-ffmpeg \
              --enable-schannel \
              --enable-protocol=file,http,https,tcp,tls \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo \
              --enable-decoder=h264,hevc,vp9,libdav1d,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv1,flv,vp6,vp6f,vp6a,theora,dnxhd,prores \
              --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3 \
              --enable-bsf=hevc_metadata,av1_metadata,vp9_metadata \
              --enable-libzimg \
              --enable-libdav1d \
              --enable-filter=scale,format,zscale,tonemap \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --enable-network \
              --disable-ffplay \
              --disable-ffprobe \
              --pkg-config=pkg-config \
              --pkg-config-flags="--static" \
              --extra-cflags="-I$ZIMG_INSTALL/include -I$DAV1D_INSTALL/include" \
              --extra-ldflags="-L$ZIMG_INSTALL/lib -L$DAV1D_INSTALL/lib -static" \
              --extra-ldexeflags="-static" \
              --extra-libs="-lstdc++ -lpthread"

            make -j$(nproc)
            cp ffmpeg.exe ../ffmpeg-windows-x86_64.exe
            ;;

          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-*


############################################################
# macOS (x86_64 + arm64)
############################################################

  build-macos:
    runs-on: macos-latest

    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install nasm pkg-config automake libtool ninja meson

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout $FFMPEG_VERSION

      - name: Configure & Build
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then

            # Build zimg
            git clone --recursive -b $ZIMG_VERSION https://github.com/sekrit-twc/zimg.git zimg-src
            cd zimg-src && ./autogen.sh && ./configure --prefix=$(pwd)/_install --host=x86_64-apple-darwin --disable-shared --enable-static --with-pic CFLAGS="-arch x86_64" CXXFLAGS="-arch x86_64" LDFLAGS="-arch x86_64" && make -j$(sysctl -n hw.ncpu) && make install && cd ..
            
            # Build dav1d
            echo "[binaries]" > cross_mac_x86_64.txt
            echo "c = ['clang', '-arch', 'x86_64']" >> cross_mac_x86_64.txt
            echo "cpp = ['clang++', '-arch', 'x86_64']" >> cross_mac_x86_64.txt
            echo "ar = 'ar'" >> cross_mac_x86_64.txt
            echo "strip = 'strip'" >> cross_mac_x86_64.txt
            echo "pkgconfig = 'pkg-config'" >> cross_mac_x86_64.txt
            echo "[host_machine]" >> cross_mac_x86_64.txt
            echo "system = 'darwin'" >> cross_mac_x86_64.txt
            echo "cpu_family = 'x86_64'" >> cross_mac_x86_64.txt
            echo "cpu = 'x86_64'" >> cross_mac_x86_64.txt
            echo "endian = 'little'" >> cross_mac_x86_64.txt

            git clone -b $DAV1D_VERSION https://code.videolan.org/videolan/dav1d.git dav1d-src
            cd dav1d-src
            meson setup build --prefix=$(pwd)/../dav1d-install --libdir=lib --cross-file ../cross_mac_x86_64.txt --default-library=static --buildtype=release
            ninja -C build install
            cd ..

            export PKG_CONFIG_PATH=$(pwd)/zimg-src/_install/lib/pkgconfig:$(pwd)/dav1d-install/lib/pkgconfig

            cd FFmpeg
            make distclean || true
            ./configure \
              --arch=x86_64 \
              --cpu=generic \
              --cc="clang -arch x86_64" \
              --cxx="clang++ -arch x86_64" \
              --target-os=darwin \
              --disable-inline-asm \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file,http,https,tcp,tls \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo \
              --enable-decoder=h264,hevc,vp9,libdav1d,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores \
              --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3 \
              --enable-bsf=hevc_metadata,av1_metadata,vp9_metadata \
              --enable-libzimg \
              --enable-libdav1d \
              --enable-filter=scale,format,zscale,tonemap \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --enable-network \
              --disable-ffplay \
              --disable-ffprobe \
              --extra-cflags="-I$(pwd)/../dav1d-install/include" \
              --extra-ldflags="-L$(pwd)/../dav1d-install/lib" \
              --extra-libs="-lpthread -lm -lstdc++"

            make -j$(sysctl -n hw.ncpu)
            cp ffmpeg ../ffmpeg-macos-x86_64

          else

            # Build zimg
            git clone --recursive -b $ZIMG_VERSION https://github.com/sekrit-twc/zimg.git zimg-src
            cd zimg-src && ./autogen.sh && ./configure --prefix=$(pwd)/_install --host=arm64-apple-darwin --disable-shared --enable-static --with-pic CFLAGS="-arch arm64" CXXFLAGS="-arch arm64" LDFLAGS="-arch arm64" && make -j$(sysctl -n hw.ncpu) && make install && cd ..
            
            # Build dav1d
            echo "[binaries]" > cross_mac_arm64.txt
            echo "c = ['clang', '-arch', 'arm64']" >> cross_mac_arm64.txt
            echo "cpp = ['clang++', '-arch', 'arm64']" >> cross_mac_arm64.txt
            echo "ar = 'ar'" >> cross_mac_arm64.txt
            echo "strip = 'strip'" >> cross_mac_arm64.txt
            echo "pkgconfig = 'pkg-config'" >> cross_mac_arm64.txt
            echo "[host_machine]" >> cross_mac_arm64.txt
            echo "system = 'darwin'" >> cross_mac_arm64.txt
            echo "cpu_family = 'aarch64'" >> cross_mac_arm64.txt
            echo "cpu = 'aarch64'" >> cross_mac_arm64.txt
            echo "endian = 'little'" >> cross_mac_arm64.txt

            git clone -b $DAV1D_VERSION https://code.videolan.org/videolan/dav1d.git dav1d-src
            cd dav1d-src
            meson setup build --prefix=$(pwd)/../dav1d-install --libdir=lib --cross-file ../cross_mac_arm64.txt --default-library=static --buildtype=release
            ninja -C build install
            cd ..

            export PKG_CONFIG_PATH=$(pwd)/zimg-src/_install/lib/pkgconfig:$(pwd)/dav1d-install/lib/pkgconfig

            cd FFmpeg
            make distclean || true
            ./configure \
              --arch=arm64 \
              --cpu=generic \
              --cc="clang -arch arm64" \
              --cxx="clang++ -arch arm64" \
              --target-os=darwin \
              --disable-x86asm \
              --disable-inline-asm \
              --disable-everything \
              --enable-ffmpeg \
              --enable-protocol=file,http,https,tcp,tls \
              --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo \
              --enable-decoder=h264,hevc,vp9,libdav1d,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores \
              --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3 \
              --enable-bsf=hevc_metadata,av1_metadata,vp9_metadata \
              --enable-libzimg \
              --enable-libdav1d \
              --enable-filter=scale,format,zscale,tonemap \
              --enable-encoder=mjpeg,png \
              --enable-muxer=image2 \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-swscale \
              --disable-doc \
              --disable-debug \
              --enable-network \
              --disable-ffplay \
              --disable-ffprobe \
              --extra-cflags="-I$(pwd)/../dav1d-install/include" \
              --extra-ldflags="-L$(pwd)/../dav1d-install/lib" \
              --extra-libs="-lpthread -lm -lstdc++"

            make -j$(sysctl -n hw.ncpu)
            cp ffmpeg ../ffmpeg-macos-arm64

          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-${{ matrix.arch }}
          path: ffmpeg-macos-*