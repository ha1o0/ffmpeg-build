name: Build Minimal FFmpeg

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: n7.0.1
  ZIMG_VERSION: release-3.0.5
  DAV1D_VERSION: 1.4.1
  WEBP_VERSION: 1.4.0
  ZLIB_VERSION: 1.3.1
  BROTLI_VERSION: 1.1.0
  HIGHWAY_VERSION: 1.1.0
  JXL_VERSION: 0.10.2

jobs:

  build-linux-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-x86_64, linux-arm64, windows-x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential nasm yasm pkg-config mingw-w64 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu autoconf automake libtool ninja-build meson cmake

      - name: Prepare Workspace Paths
        run: |
          echo "ZIMG_INSTALL=$GITHUB_WORKSPACE/zimg-install" >> $GITHUB_ENV
          echo "DAV1D_INSTALL=$GITHUB_WORKSPACE/dav1d-install" >> $GITHUB_ENV
          echo "OPENSSL_INSTALL=$GITHUB_WORKSPACE/openssl-install" >> $GITHUB_ENV
          echo "WEBP_INSTALL=$GITHUB_WORKSPACE/libwebp-install" >> $GITHUB_ENV
          echo "ZLIB_INSTALL=$GITHUB_WORKSPACE/zlib-install" >> $GITHUB_ENV
          echo "BROTLI_INSTALL=$GITHUB_WORKSPACE/brotli-install" >> $GITHUB_ENV
          echo "HIGHWAY_INSTALL=$GITHUB_WORKSPACE/highway-install" >> $GITHUB_ENV
          echo "JXL_INSTALL=$GITHUB_WORKSPACE/libjxl-install" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git --depth 1 -b $FFMPEG_VERSION FFmpeg-src

      - name: Build zimg
        run: |
          git clone -b $ZIMG_VERSION https://github.com/sekrit-twc/zimg.git zimg-src
          cd zimg-src
          sed -i 's/.*include.*tests\/Makefile.*/# &/' Makefile.am
          sed -i 's/.*include.*doc\/example\/Makefile.*/# &/' Makefile.am
          ./autogen.sh
          case "${{ matrix.target }}" in
            linux-x86_64)   HOST=x86_64-linux-gnu ;;
            linux-arm64)    HOST=aarch64-linux-gnu ;;
            windows-x86_64) HOST=x86_64-w64-mingw32 ;;
          esac
          ./configure --prefix=${{ env.ZIMG_INSTALL }} --host=$HOST --disable-shared --enable-static --with-pic --disable-unit-test
          make -j$(nproc) install

      - name: Build dav1d
        run: |
          case "${{ matrix.target }}" in
            linux-x86_64)
              git clone -b $DAV1D_VERSION https://code.videolan.org/videolan/dav1d.git dav1d-src
              cd dav1d-src
              meson setup build --prefix=${{ env.DAV1D_INSTALL }} --libdir=lib --default-library=static --buildtype=release
              ninja -C build install
              ;;
            linux-arm64)
              echo "[binaries]\nc = 'aarch64-linux-gnu-gcc'\ncpp = 'aarch64-linux-gnu-g++'\nar = 'aarch64-linux-gnu-ar'\nstrip = 'aarch64-linux-gnu-strip'\npkgconfig = 'pkg-config'\n[host_machine]\nsystem = 'linux'\ncpu_family = 'aarch64'\ncpu = 'aarch64'\nendian = 'little'" > cross.txt
              git clone -b $DAV1D_VERSION https://code.videolan.org/videolan/dav1d.git dav1d-src
              cd dav1d-src
              meson setup build --prefix=${{ env.DAV1D_INSTALL }} --libdir=lib --cross-file ../cross.txt --default-library=static --buildtype=release
              ninja -C build install
              ;;
            windows-x86_64)
              echo "[binaries]\nc = 'x86_64-w64-mingw32-gcc'\ncpp = 'x86_64-w64-mingw32-g++'\nar = 'x86_64-w64-mingw32-ar'\nstrip = 'x86_64-w64-mingw32-strip'\nwindres = 'x86_64-w64-mingw32-windres'\nnasm = 'nasm'\npkgconfig = 'pkg-config'\n[host_machine]\nsystem = 'windows'\ncpu_family = 'x86_64'\ncpu = 'x86_64'\nendian = 'little'" > cross.txt
              git clone --branch $DAV1D_VERSION --depth 1 https://code.videolan.org/videolan/dav1d.git dav1d-src
              cd dav1d-src
              meson setup build --prefix=${{ env.DAV1D_INSTALL }} --libdir=lib --cross-file ../cross.txt --default-library=static --buildtype=release -Denable_asm=true
              ninja -C build install
              ;;
          esac

      - name: Build openssl (Linux only)
        if: startsWith(matrix.target, 'linux')
        run: |
          git clone -b openssl-3.3.0 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          case "${{ matrix.target }}" in
            linux-x86_64) ./config --prefix=${{ env.OPENSSL_INSTALL }} --libdir=lib no-shared no-tests ;;
            linux-arm64)  CC=aarch64-linux-gnu-gcc ./Configure linux-aarch64 --prefix=${{ env.OPENSSL_INSTALL }} --libdir=lib no-shared no-tests ;;
          esac
          make -j$(nproc)
          make install_sw

      - name: Build libwebp
        run: |
          git clone -b v$WEBP_VERSION https://chromium.googlesource.com/webm/libwebp libwebp-src
          cd libwebp-src
          ./autogen.sh
          case "${{ matrix.target }}" in
            linux-x86_64)   HOST=x86_64-linux-gnu ;;
            linux-arm64)    HOST=aarch64-linux-gnu ;;
            windows-x86_64) HOST=x86_64-w64-mingw32 ;;
          esac
          ./configure --prefix=${{ env.WEBP_INSTALL }} --host=$HOST --disable-shared --enable-static --with-pic
          make -j$(nproc) install

      - name: Build zlib
        run: |
          git clone -b v$ZLIB_VERSION https://github.com/madler/zlib.git zlib-src
          cd zlib-src
          case "${{ matrix.target }}" in
            linux-x86_64)   ./configure --prefix=${{ env.ZLIB_INSTALL }} --static ;;
            linux-arm64)    CC=aarch64-linux-gnu-gcc ./configure --prefix=${{ env.ZLIB_INSTALL }} --static ;;
            windows-x86_64) CHOST=x86_64-w64-mingw32 ./configure --prefix=${{ env.ZLIB_INSTALL }} --static ;;
          esac
          make -j$(nproc) install

      - name: Build Brotli (For JXL)
        run: |
          git clone -b v$BROTLI_VERSION https://github.com/google/brotli.git brotli-src
          cd brotli-src
          mkdir -p cmake_build && cd cmake_build
          case "${{ matrix.target }}" in
            linux-x86_64)   cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.BROTLI_INSTALL }} -DBUILD_SHARED_LIBS=OFF ;;
            linux-arm64)    cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.BROTLI_INSTALL }} -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DBUILD_SHARED_LIBS=OFF ;;
            windows-x86_64) cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.BROTLI_INSTALL }} -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DBUILD_SHARED_LIBS=OFF ;;
          esac
          make -j$(nproc) install

      - name: Build Highway (For JXL)
        run: |
          git clone -b $HIGHWAY_VERSION https://github.com/google/highway.git highway-src
          cd highway-src
          mkdir -p cmake_build && cd cmake_build
          case "${{ matrix.target }}" in
            linux-x86_64)   cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.HIGHWAY_INSTALL }} -DBUILD_SHARED_LIBS=OFF -DHWY_ENABLE_EXAMPLES=OFF -DHWY_ENABLE_TESTS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON ;;
            linux-arm64)    cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.HIGHWAY_INSTALL }} -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DBUILD_SHARED_LIBS=OFF -DHWY_ENABLE_EXAMPLES=OFF -DHWY_ENABLE_TESTS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON ;;
            windows-x86_64) cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.HIGHWAY_INSTALL }} -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DBUILD_SHARED_LIBS=OFF -DHWY_ENABLE_EXAMPLES=OFF -DHWY_ENABLE_TESTS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON ;;
          esac
          make -j$(nproc) install

      - name: Build libjxl
        run: |
          git clone -b v$JXL_VERSION https://github.com/libjxl/libjxl.git libjxl-src
          cd libjxl-src
          git submodule update --init --recursive
          mkdir -p cmake_build && cd cmake_build
          case "${{ matrix.target }}" in
            linux-x86_64)   cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.JXL_INSTALL }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_BENCHMARKS=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_MANPAGES=OFF -DJPEGXL_BUNDLE_LIBPNG=OFF -DBrotli_INCLUDE_DIR=${{ env.BROTLI_INSTALL }}/include -DBrotli_LIBRARY=${{ env.BROTLI_INSTALL }}/lib/libbrotlicommon.a -DHWY_INCLUDE_DIR=${{ env.HIGHWAY_INSTALL }}/include -DHWY_LIBRARY=${{ env.HIGHWAY_INSTALL }}/lib/libhwy.a -DCMAKE_POSITION_INDEPENDENT_CODE=ON ;;
            linux-arm64)    cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.JXL_INSTALL }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_BENCHMARKS=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_MANPAGES=OFF -DJPEGXL_BUNDLE_LIBPNG=OFF -DBrotli_INCLUDE_DIR=${{ env.BROTLI_INSTALL }}/include -DBrotli_LIBRARY=${{ env.BROTLI_INSTALL }}/lib/libbrotlicommon.a -DHWY_INCLUDE_DIR=${{ env.HIGHWAY_INSTALL }}/include -DHWY_LIBRARY=${{ env.HIGHWAY_INSTALL }}/lib/libhwy.a -DCMAKE_POSITION_INDEPENDENT_CODE=ON ;;
            windows-x86_64) cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.JXL_INSTALL }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_BENCHMARKS=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_MANPAGES=OFF -DJPEGXL_BUNDLE_LIBPNG=OFF -DBrotli_INCLUDE_DIR=${{ env.BROTLI_INSTALL }}/include -DBrotli_LIBRARY=${{ env.BROTLI_INSTALL }}/lib/libbrotlicommon.a -DHWY_INCLUDE_DIR=${{ env.HIGHWAY_INSTALL }}/include -DHWY_LIBRARY=${{ env.HIGHWAY_INSTALL }}/lib/libhwy.a -DCMAKE_POSITION_INDEPENDENT_CODE=ON ;;
          esac
          make -j$(nproc) install

      - name: Configure FFmpeg
        run: |
          cd FFmpeg-src
          
          # 1. Identity Hijack: Rename internal decoder names (Precise Struct Member Match)
          sed -i 's|\.p\.name\s*=\s*"libdav1d"|.p.name = "av1"|g' libavcodec/libdav1d.c
          sed -i 's|\.p\.wrapper_name\s*=\s*"libdav1d"|.p.wrapper_name = "av1"|g' libavcodec/libdav1d.c
          sed -i 's|\.p\.name\s*=\s*"libwebp"|.p.name = "webp"|g' libavcodec/libwebp*.c
          sed -i 's|\.p\.wrapper_name\s*=\s*"libwebp"|.p.wrapper_name = "webp"|g' libavcodec/libwebp*.c

          # 2. Nuclear Bypass: Manually enable libs and set flags (bypass pkg-config)
          sed -i "s|require_pkg_config libdav1d.*|enable libdav1d; libdav1d_cflags='-I${{ env.DAV1D_INSTALL }}/include'; libdav1d_extralibs='-L${{ env.DAV1D_INSTALL }}/lib -ldav1d'|g" configure
          sed -i "s|require_pkg_config libwebp.*|enable libwebp; libwebp_cflags='-I${{ env.WEBP_INSTALL }}/include'; libwebp_extralibs='-L${{ env.WEBP_INSTALL }}/lib -lwebp -lsharpyuv'|g" configure
          sed -i "s|require_pkg_config libjxl.*|enable libjxl; libjxl_cflags='-I${{ env.JXL_INSTALL }}/include'; libjxl_extralibs='-L${{ env.JXL_INSTALL }}/lib -ljxl -ljxl_threads -lhwy -lbrotlienc -lbrotlidec -lbrotlicommon'|g" configure
          sed -i "s|require_pkg_config libzimg.*|enable libzimg; libzimg_cflags='-I${{ env.ZIMG_INSTALL }}/include'; libzimg_extralibs='-L${{ env.ZIMG_INSTALL }}/lib -lzimg'|g" configure

          case "${{ matrix.target }}" in
            linux-x86_64)
              ./configure --arch=x86_64 --cpu=generic --target-os=linux \
                --extra-cflags="-I${{ env.ZIMG_INSTALL }}/include -I${{ env.DAV1D_INSTALL }}/include -I${{ env.OPENSSL_INSTALL }}/include -I${{ env.WEBP_INSTALL }}/include -I${{ env.ZLIB_INSTALL }}/include -I${{ env.JXL_INSTALL }}/include -I${{ env.BROTLI_INSTALL }}/include -I${{ env.HIGHWAY_INSTALL }}/include" \
                --extra-ldflags="-L${{ env.ZIMG_INSTALL }}/lib -L${{ env.DAV1D_INSTALL }}/lib -L${{ env.OPENSSL_INSTALL }}/lib -L${{ env.WEBP_INSTALL }}/lib -L${{ env.ZLIB_INSTALL }}/lib -L${{ env.JXL_INSTALL }}/lib -L${{ env.BROTLI_INSTALL }}/lib -L${{ env.HIGHWAY_INSTALL }}/lib -static" \
                --extra-libs="-lssl -lcrypto -lwebp -lsharpyuv -lz -ljxl -ljxl_threads -lhwy -lbrotlienc -lbrotlidec -lbrotlicommon -ldav1d -lpthread -lm -ldl -lstdc++" \
                --enable-openssl --disable-x86asm --disable-inline-asm --disable-everything --enable-ffmpeg --enable-version3 --enable-libwebp --enable-libjxl --enable-zlib \
                --enable-protocol=file,http,https,tls,tcp,tls_openssl,dns,httpproxy,crypto \
                --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo,image2,gif,heif,avif,jxl,ico,webp,psd,dds,j2k,jp2,pnm,sgi \
                --enable-decoder=h264,hevc,vp9,libdav1d,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores,mjpeg,png,libwebp,gif,bmp,tiff,ico,targa,pcx,xbm,alias_pix,sunrast,xwd,jxl,libjxl,psd,dds,jpeg2000,pam,pbm,pgm,ppm,sgi \
                --disable-decoder=av1,webp --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3,mjpeg,png,webp,gif --enable-bsf=hevc_metadata,av1_metadata,vp9_metadata \
                --enable-libzimg --enable-libdav1d --enable-filter=scale,format,zscale,tonemap --enable-encoder=mjpeg,png,libwebp,webp --enable-muxer=image2 --enable-avcodec --enable-avformat --enable-avutil --enable-swscale --disable-doc --disable-debug --enable-network --disable-ffplay --disable-ffprobe --pkg-config=pkg-config --pkg-config-flags="--static"
              ;;
            linux-arm64)
              ./configure --arch=arm64 --cpu=generic --target-os=linux --cross-prefix=aarch64-linux-gnu- \
                --extra-cflags="-I${{ env.ZIMG_INSTALL }}/include -I${{ env.DAV1D_INSTALL }}/include -I${{ env.OPENSSL_INSTALL }}/include -I${{ env.WEBP_INSTALL }}/include -I${{ env.ZLIB_INSTALL }}/include -I${{ env.JXL_INSTALL }}/include -I${{ env.BROTLI_INSTALL }}/include -I${{ env.HIGHWAY_INSTALL }}/include" \
                --extra-ldflags="-L${{ env.ZIMG_INSTALL }}/lib -L${{ env.DAV1D_INSTALL }}/lib -L${{ env.OPENSSL_INSTALL }}/lib -L${{ env.WEBP_INSTALL }}/lib -L${{ env.ZLIB_INSTALL }}/lib -L${{ env.JXL_INSTALL }}/lib -L${{ env.BROTLI_INSTALL }}/lib -L${{ env.HIGHWAY_INSTALL }}/lib -static" \
                --extra-libs="-lssl -lcrypto -lwebp -lsharpyuv -lz -ljxl -ljxl_threads -lhwy -lbrotlienc -lbrotlidec -lbrotlicommon -ldav1d -lpthread -lm -ldl -lstdc++" \
                --enable-openssl --disable-x86asm --disable-inline-asm --disable-everything --enable-ffmpeg --enable-version3 --enable-libwebp --enable-libjxl --enable-zlib \
                --enable-protocol=file,http,https,tls,tcp,tls_openssl,dns,httpproxy,crypto \
                --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo,image2,gif,heif,avif,jxl,ico,webp,psd,dds,j2k,jp2,pnm,sgi \
                --enable-decoder=h264,hevc,vp9,libdav1d,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores,mjpeg,png,libwebp,gif,bmp,tiff,ico,targa,pcx,xbm,alias_pix,sunrast,xwd,jxl,libjxl,psd,dds,jpeg2000,pam,pbm,pgm,ppm,sgi \
                --disable-decoder=av1,webp --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3,mjpeg,png,webp,gif --enable-bsf=hevc_metadata,av1_metadata,vp9_metadata \
                --enable-libzimg --enable-libdav1d --enable-filter=scale,format,zscale,tonemap --enable-encoder=mjpeg,png,libwebp,webp --enable-muxer=image2 --enable-avcodec --enable-avformat --enable-avutil --enable-swscale --disable-doc --disable-debug --enable-network --disable-ffplay --disable-ffprobe --pkg-config=pkg-config --pkg-config-flags="--static"
              ;;
            windows-x86_64)
              ./configure --arch=x86_64 --cpu=generic --target-os=mingw32 --cross-prefix=x86_64-w64-mingw32- --enable-schannel \
                --extra-cflags="-I${{ env.ZIMG_INSTALL }}/include -I${{ env.DAV1D_INSTALL }}/include -I${{ env.WEBP_INSTALL }}/include -I${{ env.ZLIB_INSTALL }}/include -I${{ env.JXL_INSTALL }}/include -I${{ env.BROTLI_INSTALL }}/include -I${{ env.HIGHWAY_INSTALL }}/include" \
                --extra-ldflags="-L${{ env.ZIMG_INSTALL }}/lib -L${{ env.DAV1D_INSTALL }}/lib -L${{ env.WEBP_INSTALL }}/lib -L${{ env.ZLIB_INSTALL }}/lib -L${{ env.JXL_INSTALL }}/lib -L${{ env.BROTLI_INSTALL }}/lib -L${{ env.HIGHWAY_INSTALL }}/lib -static" \
                --extra-libs="-lwebp -lsharpyuv -lz -ljxl -ljxl_threads -lhwy -lbrotlienc -lbrotlidec -lbrotlicommon -ldav1d -lstdc++ -lpthread" \
                --disable-everything --enable-ffmpeg --enable-version3 --enable-libwebp --enable-libjxl --enable-zlib --enable-protocol=file,http,https,tcp,tls --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo,image2,gif,heif,avif,jxl,ico,webp,psd,dds,j2k,jp2,pnm,sgi --enable-decoder=h264,hevc,vp9,libdav1d,libwebp,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv1,flv,vp6,vp6f,vp6a,theora,dnxhd,prores,mjpeg,png,webp,gif,bmp,tiff,ico,targa,pcx,xbm,alias_pix,sunrast,xwd,jxl,libjxl,psd,dds,jpeg2000,pam,pbm,pgm,ppm,sgi --disable-decoder=av1,webp --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3,mjpeg,png,webp,gif --enable-bsf=hevc_metadata,av1_metadata,vp9_metadata --enable-libzimg --enable-libdav1d --enable-filter=scale,format,zscale,tonemap --enable-encoder=mjpeg,png,libwebp,webp --enable-muxer=image2 --enable-avcodec --enable-avformat --enable-avutil --enable-swscale --disable-doc --disable-debug --enable-network --disable-ffplay --disable-ffprobe --pkg-config=pkg-config --pkg-config-flags="--static"
              ;;
          esac

      - name: Build and Package
        run: |
          cd FFmpeg-src
          make -j$(nproc)
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            cp ffmpeg.exe ../ffmpeg-windows-x86_64.exe
          else
            cp ffmpeg ../ffmpeg-${{ matrix.target }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-*

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install nasm pkg-config automake libtool ninja meson cmake

      - name: Prepare Workspace Paths
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          echo "INSTALL_DIR=$GITHUB_WORKSPACE/install" >> $GITHUB_ENV
          mkdir -p $GITHUB_WORKSPACE/install

      - name: Clone FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git --depth 1 -b $FFMPEG_VERSION FFmpeg-src

      - name: Build zimg
        run: |
          git clone --recursive -b $ZIMG_VERSION https://github.com/sekrit-twc/zimg.git zimg-src
          cd zimg-src && ./autogen.sh && CC="clang -arch ${{ matrix.arch }}" CXX="clang++ -arch ${{ matrix.arch }}" ./configure --prefix=${{ env.INSTALL_DIR }} --host=${{ matrix.arch }}-apple-darwin --disable-shared --enable-static --with-pic CFLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=11.0 -isysroot $(xcrun --sdk macosx --show-sdk-path)" CXXFLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=11.0 -isysroot $(xcrun --sdk macosx --show-sdk-path)" LDFLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=11.0" && make -j$(sysctl -n hw.ncpu) install

      - name: Build dav1d
        run: |
          echo "[binaries]\nc = ['clang', '-arch', '${{ matrix.arch }}', '-mmacosx-version-min=11.0', '-isysroot', '$(xcrun --sdk macosx --show-sdk-path)']\ncpp = ['clang++', '-arch', '${{ matrix.arch }}', '-mmacosx-version-min=11.0', '-isysroot', '$(xcrun --sdk macosx --show-sdk-path)']\nar = 'ar'\nstrip = 'strip'\nnasm = 'nasm'\npkgconfig = 'pkg-config'\n[host_machine]\nsystem = 'darwin'\ncpu_family = '${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}'\ncpu = '${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}'\nendian = 'little'" > cross.txt
          git clone --branch $DAV1D_VERSION --depth 1 https://code.videolan.org/videolan/dav1d.git dav1d-src
          cd dav1d-src && meson setup build --prefix=${{ env.INSTALL_DIR }} --libdir=lib --cross-file ../cross.txt --default-library=static --buildtype=release -Denable_asm=true && ninja -C build install

      - name: Build libwebp
        run: |
          git clone -b v$WEBP_VERSION https://chromium.googlesource.com/webm/libwebp libwebp-src
          cd libwebp-src && ./autogen.sh && CC="clang -arch ${{ matrix.arch }}" CXX="clang++ -arch ${{ matrix.arch }}" ./configure --prefix=${{ env.INSTALL_DIR }} --host=${{ matrix.arch }}-apple-darwin --disable-shared --enable-static --with-pic CFLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=11.0" LDFLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=11.0" && make -j$(sysctl -n hw.ncpu) install

      - name: Build zlib
        run: |
          git clone -b v$ZLIB_VERSION https://github.com/madler/zlib.git zlib-src
          cd zlib-src && CC="clang -arch ${{ matrix.arch }} -mmacosx-version-min=11.0" ./configure --prefix=${{ env.INSTALL_DIR }} --static && make -j$(sysctl -n hw.ncpu) install

      - name: Build Brotli
        run: |
          git clone -b v$BROTLI_VERSION https://github.com/google/brotli.git brotli-src
          cd brotli-src && mkdir -p cmake_build && cd cmake_build && cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }} -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS="-arch ${{ matrix.arch }}" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-arch ${{ matrix.arch }}" -DBUILD_SHARED_LIBS=OFF && make -j$(sysctl -n hw.ncpu) install

      - name: Build Highway
        run: |
          git clone -b $HIGHWAY_VERSION https://github.com/google/highway.git highway-src
          cd highway-src && mkdir -p cmake_build && cd cmake_build && cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }} -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS="-arch ${{ matrix.arch }}" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-arch ${{ matrix.arch }}" -DBUILD_SHARED_LIBS=OFF -DHWY_ENABLE_EXAMPLES=OFF -DHWY_ENABLE_TESTS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON && make -j$(sysctl -n hw.ncpu) install

      - name: Build libjxl
        run: |
          git clone -b v$JXL_VERSION https://github.com/libjxl/libjxl.git libjxl-src
          cd libjxl-src && git submodule update --init --recursive
          mkdir -p cmake_build && cd cmake_build && cmake .. -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=11.0" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=11.0" -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_BENCHMARKS=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_MANPAGES=OFF -DJPEGXL_BUNDLE_LIBPNG=OFF -DBrotli_INCLUDE_DIR=${{ env.INSTALL_DIR }}/include -DBrotli_LIBRARY=${{ env.INSTALL_DIR }}/lib/libbrotlicommon.a -DHWY_INCLUDE_DIR=${{ env.INSTALL_DIR }}/include -DHWY_LIBRARY=${{ env.INSTALL_DIR }}/lib/libhwy.a && make -j$(sysctl -n hw.ncpu) install

      - name: Configure and Build FFmpeg
        run: |
          cd FFmpeg-src
          
          # 1. Identity Hijack: Rename internal decoder names (Precise Struct Member Match)
          sed -i '' 's|\.p\.name\s*=\s*"libdav1d"|.p.name = "av1"|g' libavcodec/libdav1d.c
          sed -i '' 's|\.p\.wrapper_name\s*=\s*"libdav1d"|.p.wrapper_name = "av1"|g' libavcodec/libdav1d.c
          sed -i '' 's|\.p\.name\s*=\s*"libwebp"|.p.name = "webp"|g' libavcodec/libwebp*.c
          sed -i '' 's|\.p\.wrapper_name\s*=\s*"libwebp"|.p.wrapper_name = "webp"|g' libavcodec/libwebp*.c
          
          # 2. Nuclear Bypass: Manually enable libs and set flags (bypass pkg-config)
          sed -i '' "s|require_pkg_config libdav1d.*|enable libdav1d; libdav1d_cflags='-I${{ env.INSTALL_DIR }}/include'; libdav1d_extralibs='-L${{ env.INSTALL_DIR }}/lib -ldav1d'|g" configure
          sed -i '' "s|require_pkg_config libwebp.*|enable libwebp; libwebp_cflags='-I${{ env.INSTALL_DIR }}/include'; libwebp_extralibs='-L${{ env.INSTALL_DIR }}/lib -lwebp -lsharpyuv'|g" configure
          sed -i '' "s|require_pkg_config libjxl.*|enable libjxl; libjxl_cflags='-I${{ env.INSTALL_DIR }}/include'; libjxl_extralibs='-L${{ env.INSTALL_DIR }}/lib -ljxl -ljxl_threads -lhwy -lbrotlienc -lbrotlidec -lbrotlicommon'|g" configure
          sed -i '' "s|require_pkg_config libzimg.*|enable libzimg; libzimg_cflags='-I${{ env.INSTALL_DIR }}/include'; libzimg_extralibs='-L${{ env.INSTALL_DIR }}/lib -lzimg'|g" configure
          
          export PKG_CONFIG_PATH="${{ env.INSTALL_DIR }}/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_PATH"
          export PKG_CONFIG_ALLOW_CROSS=1
          
          ./configure \
            --arch=${{ matrix.arch }} --cc="clang -arch ${{ matrix.arch }}" --cxx="clang++ -arch ${{ matrix.arch }}" --target-os=darwin \
            --extra-cflags="-arch ${{ matrix.arch }} -mmacosx-version-min=11.0 -I${{ env.INSTALL_DIR }}/include" \
            --extra-ldflags="-arch ${{ matrix.arch }} -mmacosx-version-min=11.0 -L${{ env.INSTALL_DIR }}/lib" \
            --extra-asflags="-arch ${{ matrix.arch }} -mmacosx-version-min=11.0" \
            --extra-libs="-lwebp -lsharpyuv -lz -ljxl -ljxl_threads -lhwy -lbrotlienc -lbrotlidec -lbrotlicommon -ldav1d -lpthread -lm -lstdc++" \
            --disable-everything --enable-ffmpeg --enable-version3 --enable-libwebp --enable-libjxl --enable-zlib \
            --enable-protocol=file,http,https,tcp,tls \
            --enable-demuxer=mov,matroska,avi,flv,mpegts,mpeg,mpegps,asf,ogg,rm,mxf,mpegvideo,image2,gif,heif,avif,jxl,ico,webp,psd,dds,j2k,jp2,pnm,sgi \
            --enable-decoder=h264,hevc,vp9,libdav1d,libwebp,mpeg1video,mpeg2video,mpeg4,msmpeg4v3,wmv3,rv10,rv20,rv30,rv40,h263,h263p,h263i,mp3,mp2,ac3,aac,mpegvideo,flv,flv1,vp6,vp6f,vp6a,theora,dnxhd,prores,mjpeg,png,gif,bmp,tiff,ico,targa,pcx,xbm,alias_pix,sunrast,xwd,jxl,libjxl,psd,dds,jpeg2000,pam,pbm,pgm,ppm,sgi \
            --disable-decoder=av1,webp \
            --enable-parser=h264,hevc,mpeg4video,mpegvideo,av1,h263,mpegaudio,ac3,mjpeg,png,webp,gif \
            --enable-bsf=hevc_metadata,av1_metadata,vp9_metadata --enable-libzimg --enable-libdav1d --enable-filter=scale,format,zscale,tonemap --enable-encoder=mjpeg,png,libwebp,webp --enable-muxer=image2 --enable-avcodec --enable-avformat --enable-avutil --enable-swscale --disable-doc --disable-debug --enable-network --disable-ffplay --disable-ffprobe --pkg-config=pkg-config --pkg-config-flags="--static"
          make -j$(sysctl -n hw.ncpu)
          cp ffmpeg ../ffmpeg-macos-${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-${{ matrix.arch }}
          path: ffmpeg-macos-*
